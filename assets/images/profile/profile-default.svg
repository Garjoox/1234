<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="400" height="400" rx="200" fill="url(#bgGrad)"/>

  <!-- Technical Circuit / Node Graphics -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.3"/>
  <circle cx="200" cy="200" r="160" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.5"/>

  <!-- Floating Database Stack Nodes -->
  <g opacity="0.25">
    <ellipse cx="90" cy="110" rx="35" ry="12" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <path d="M 55 110 v 18 a 35 12 0 0 0 70 0 v -18" fill="none" stroke="#38BDF8" stroke-width="2"/>
    
    <ellipse cx="310" cy="280" rx="35" ry="12" fill="none" stroke="#F97316" stroke-width="2"/>
    <path d="M 275 280 v 18 a 35 12 0 0 0 70 0 v -18" fill="none" stroke="#F97316" stroke-width="2"/>
  </g>

  <!-- Avatar Portrait Silhouette -->
  <g transform="translate(0, 20)">
    <!-- Shoulders / Suit silhouette -->
    <path d="M 100 320 Q 200 240 300 320 L 320 380 Q 200 400 80 380 Z" fill="#090D16" opacity="0.9"/>
    <!-- Collar & Tie Detail -->
    <path d="M 175 280 L 200 340 L 225 280 L 210 270 L 200 285 L 190 270 Z" fill="#38BDF8" opacity="0.8"/>
    <!-- Head silhouette with soft glow -->
    <ellipse cx="200" cy="190" rx="65" ry="75" fill="url(#avatarGrad)" filter="url(#glow)" opacity="0.9"/>
    <ellipse cx="200" cy="185" rx="60" ry="70" fill="#0F172A"/>
  </g>

  <!-- Central Professional Monogram Overlay -->
  <text x="200" y="200" font-family="'Inter', 'Outfit', sans-serif" font-size="54" font-weight="800" fill="#F8FAFC" text-anchor="middle" letter-spacing="3">AMA</text>
  <text x="200" y="235" font-family="'Inter', 'Outfit', sans-serif" font-size="13" font-weight="600" fill="#38BDF8" text-anchor="middle" letter-spacing="4">CLOUD DBA &amp; M&amp;E</text>

  <!-- Security Shield & Database Badge Overlay at bottom right -->
  <g transform="translate(265, 265)">
    <circle cx="35" cy="35" r="35" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <!-- Security Shield -->
    <path d="M 35 18 L 50 25 V 36 C 50 46 35 52 35 52 C 35 52 20 46 20 36 V 25 Z" fill="none" stroke="#F97316" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 30 35 L 34 39 L 42 30" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
