<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#31103F"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="12" fill="url(#p4Grad)"/>

  <!-- Performance Gauge Visual -->
  <g transform="translate(180, 40)">
    <!-- Arc gauge -->
    <path d="M 40 160 A 100 100 0 1 1 200 160" fill="none" stroke="#1E293B" stroke-width="18" stroke-linecap="round"/>
    <path d="M 40 160 A 100 100 0 0 1 180 70" fill="none" stroke="#F97316" stroke-width="18" stroke-linecap="round"/>
    <circle cx="120" cy="150" r="12" fill="#F8FAFC"/>
    <line x1="120" y1="150" x2="170" y2="90" stroke="#F97316" stroke-width="5" stroke-linecap="round"/>
    <text x="120" y="195" font-family="sans-serif" font-size="28" font-weight="800" fill="#F8FAFC" text-anchor="middle">98.4%</text>
    <text x="120" y="215" font-family="sans-serif" font-size="12" font-weight="600" fill="#38BDF8" text-anchor="middle">QUERY ACCELERATION</text>
  </g>

  <!-- Query tuning before / after comparison -->
  <rect x="50" y="240" width="230" height="90" rx="8" fill="#090D16" stroke="#EF4444" stroke-width="1"/>
  <text x="70" y="265" font-family="monospace" font-size="11" fill="#EF4444">BEFORE OPTIMIZATION</text>
  <text x="70" y="285" font-family="monospace" font-size="11" fill="#94A3B8">Sequential Scan: 14.8s</text>
  <text x="70" y="305" font-family="monospace" font-size="11" fill="#94A3B8">High I/O Wait &amp; CPU Spike</text>

  <rect x="320" y="240" width="230" height="90" rx="8" fill="#090D16" stroke="#10B981" stroke-width="1.5"/>
  <text x="340" y="265" font-family="monospace" font-size="11" fill="#10B981">AFTER INDEX TUNING</text>
  <text x="340" y="285" font-family="monospace" font-size="11" fill="#F8FAFC">Index Scan: 0.012s</text>
  <text x="340" y="305" font-family="monospace" font-size="11" fill="#10B981">Efficiency Boost: +1200x</text>

  <rect x="380" y="25" width="180" height="32" rx="16" fill="rgba(249, 115, 22, 0.2)" stroke="#F97316" stroke-width="1"/>
  <text x="470" y="46" font-family="sans-serif" font-size="12" font-weight="700" fill="#F97316" text-anchor="middle">PERFORMANCE TUNING</text>
</svg>
