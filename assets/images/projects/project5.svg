<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p5Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="12" fill="url(#p5Grad)"/>

  <!-- Cloud outline -->
  <path d="M 220 160 Q 200 110 260 100 Q 290 60 350 80 Q 410 70 430 110 Q 470 120 460 160 Q 480 200 430 220 H 220 Q 170 200 220 160 Z" fill="#090D16" opacity="0.85" stroke="#38BDF8" stroke-width="2"/>

  <!-- Docker / Database Nodes inside Cloud -->
  <rect x="250" y="125" width="60" height="40" rx="4" fill="#0284C7" stroke="#38BDF8"/>
  <text x="280" y="148" font-family="sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Azure DB</text>

  <rect x="330" y="125" width="60" height="40" rx="4" fill="#2563EB" stroke="#38BDF8"/>
  <text x="360" y="148" font-family="sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Docker</text>

  <circle cx="300" cy="240" r="25" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
  <text x="300" y="244" font-family="sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">HA</text>

  <!-- Connective lines -->
  <line x1="280" y1="165" x2="300" y2="215" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="360" y1="165" x2="300" y2="215" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Cloud Infrastructure badge -->
  <rect x="380" y="25" width="180" height="32" rx="16" fill="rgba(56, 189, 248, 0.2)" stroke="#38BDF8" stroke-width="1"/>
  <text x="470" y="46" font-family="sans-serif" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle">CLOUD INFRASTRUCTURE</text>
</svg>
