<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="ssmsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CC292B"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="12" fill="url(#p2Grad)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.12" stroke="#F97316" stroke-width="1">
    <path d="M 0 50 H 600 M 0 100 H 600 M 0 150 H 600 M 0 200 H 600 M 0 250 H 600 M 0 300 H 600"/>
    <path d="M 100 0 V 360 M 200 0 V 360 M 300 0 V 360 M 400 0 V 360 M 500 0 V 360"/>
  </g>

  <!-- SSMS Window Graphic -->
  <rect x="70" y="50" width="460" height="250" rx="10" fill="#0B0F19" stroke="#334155" stroke-width="2"/>
  <rect x="70" y="50" width="460" height="35" rx="10" fill="#1E293B"/>
  <circle cx="95" cy="67" r="5" fill="#EF4444"/>
  <circle cx="110" cy="67" r="5" fill="#F59E0B"/>
  <circle cx="125" cy="67" r="5" fill="#10B981"/>
  <text x="145" y="72" font-family="sans-serif" font-size="12" font-weight="600" fill="#94A3B8">Microsoft SQL Server Management Studio (SSMS)</text>

  <!-- Object Explorer Panel -->
  <rect x="85" y="105" width="140" height="180" rx="6" fill="#1E293B" opacity="0.8"/>
  <text x="95" y="125" font-family="sans-serif" font-size="11" font-weight="700" fill="#38BDF8">Object Explorer</text>
  <text x="95" y="145" font-family="monospace" font-size="10" fill="#CBD5E1">► Databases</text>
  <text x="105" y="163" font-family="monospace" font-size="10" fill="#F97316">  ▼ Production_DB</text>
  <text x="115" y="180" font-family="monospace" font-size="10" fill="#94A3B8">    ► Tables</text>
  <text x="115" y="195" font-family="monospace" font-size="10" fill="#94A3B8">    ► Views</text>
  <text x="115" y="210" font-family="monospace" font-size="10" fill="#94A3B8">    ► Security</text>

  <!-- Query & Execution Window -->
  <rect x="240" y="105" width="275" height="180" rx="6" fill="#090D16" stroke="#1E293B" stroke-width="1"/>
  <text x="255" y="130" font-family="monospace" font-size="11" fill="#F97316">USE [Production_DB];</text>
  <text x="255" y="150" font-family="monospace" font-size="11" fill="#38BDF8">EXEC sp_configure 'max server memory';</text>
  <text x="255" y="170" font-family="monospace" font-size="11" fill="#F8FAFC">CREATE UNIQUE CLUSTERED INDEX IX_Users</text>
  <text x="255" y="190" font-family="monospace" font-size="11" fill="#F8FAFC">ON dbo.Users(UserID) WITH (FILLFACTOR=80);</text>

  <rect x="255" y="220" width="245" height="50" rx="4" fill="#1E293B"/>
  <text x="265" y="240" font-family="monospace" font-size="10" fill="#10B981">✓ Command(s) completed successfully.</text>
  <text x="265" y="258" font-family="monospace" font-size="10" fill="#94A3B8">Rows affected: 148,290 (Time: 00:00:01.04)</text>

  <!-- SQL Badge -->
  <rect x="420" y="15" width="140" height="30" rx="15" fill="url(#ssmsGrad)"/>
  <text x="490" y="35" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">SQL SERVER DBA</text>
</svg>
