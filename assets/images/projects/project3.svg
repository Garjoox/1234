<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="12" fill="url(#p3Grad)"/>

  <!-- Shield icon & Backup Cycle -->
  <g transform="translate(140, 60)">
    <circle cx="160" cy="110" r="90" fill="none" stroke="#10B981" stroke-width="3" stroke-dasharray="10 8"/>
    <!-- Shield -->
    <path d="M 160 50 L 210 75 V 135 C 210 175 160 200 160 200 C 160 200 110 175 110 135 V 75 Z" fill="#047857" stroke="#34D399" stroke-width="3"/>
    <path d="M 145 125 L 155 135 L 175 110" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Backup metrics pills -->
  <rect x="50" y="270" width="150" height="50" rx="8" fill="#090D16" stroke="#10B981" stroke-width="1.5"/>
  <text x="125" y="292" font-family="sans-serif" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">RPO: &lt; 5 MINS</text>
  <text x="125" y="308" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Point-In-Time Restore</text>

  <rect x="225" y="270" width="150" height="50" rx="8" fill="#090D16" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="300" y="292" font-family="sans-serif" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">RTO: &lt; 15 MINS</text>
  <text x="300" y="308" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Disaster Failover</text>

  <rect x="400" y="270" width="150" height="50" rx="8" fill="#090D16" stroke="#F97316" stroke-width="1.5"/>
  <text x="475" y="292" font-family="sans-serif" font-size="11" font-weight="700" fill="#F97316" text-anchor="middle">AES-256</text>
  <text x="475" y="308" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Encrypted Backups</text>

  <rect x="390" y="30" width="170" height="32" rx="16" fill="rgba(16, 185, 129, 0.2)" stroke="#10B981" stroke-width="1"/>
  <text x="475" y="51" font-family="sans-serif" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle">BACKUP &amp; RECOVERY</text>
</svg>
