  <rect x="330" y="175" width="170" height="48" rx="6" fill="#1E293B"/>
  <text x="345" y="195" font-family="sans-serif" font-size="10" fill="#94A3B8">Evidence Rating</text>
  <text x="345" y="212" font-family="sans-serif" font-size="13" font-weight="700" fill="#F97316">Grade A (High Impact)</text>

  <rect x="375" y="18" width="180" height="32" rx="16" fill="rgba(45, 212, 191, 0.2)" stroke="#2DD4BF" stroke-width="1"/>
  <text x="465" y="39" font-family="sans-serif" font-size="12" font-weight="700" fill="#2DD4BF" text-anchor="middle">RESEARCH &amp; M&amp;E SYSTEM</text>
