      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="12" fill="url(#p6Grad)"/>

  <!-- Analytics & Indicator Dashboard Visual -->
  <rect x="70" y="60" width="460" height="230" rx="10" fill="#090D16" stroke="#2DD4BF" stroke-width="1.5" opacity="0.9"/>

