# ==========================================================================
# POSTGRESQL DBA LAB - TUNED CONFIGURATION FILE (postgresql.conf)
# Target Version: PostgreSQL 16
# Purpose: Performance Tuning, High Availability, WAL Archiving & Audit Logging
# ==========================================================================

# --------------------------------------------------------------------------
# 1. CONNECTIONS AND AUTHENTICATION
# --------------------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 100
password_encryption = scram-sha-256

# --------------------------------------------------------------------------
# 2. MEMORY AND CACHE ALLOCATION
# --------------------------------------------------------------------------
shared_buffers = 256MB                  # Shared memory allocated for page caching
work_mem = 16MB                         # Memory allocated per sorting/hash operation
maintenance_work_mem = 64MB             # Memory used by VACUUM, CREATE INDEX, ALTER TABLE
effective_cache_size = 768MB            # Estimated total cache available for query planning

# --------------------------------------------------------------------------
# 3. WRITE-AHEAD LOG (WAL) & REPLICATION SETTINGS
# --------------------------------------------------------------------------
wal_level = replica                     # Enables streaming replication and point-in-time recovery
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9      # Smooth out I/O spikes during checkpoints
checkpoint_timeout = 15min

# WAL Archiving for Disaster Recovery
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'

# --------------------------------------------------------------------------
# 4. QUERY PLANNER & OPTIMIZATION
# --------------------------------------------------------------------------
random_page_cost = 1.1                  # Adjusted for fast SSD storage
effective_io_concurrency = 200

# --------------------------------------------------------------------------
# 5. DIAGNOSTIC LOGGING & MONITORING
# --------------------------------------------------------------------------
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 250        # Log any SQL statement taking longer than 250ms

log_line_prefix = '%m [%p] %q%u@%d '    # Timestamp [PID] User@Database
log_statement = 'ddl'                   # Audit log all DDL operations (CREATE, ALTER, DROP)
log_lock_waits = on                     # Log queries waiting longer than deadlock_timeout for locks
deadlock_timeout = 1s

# --------------------------------------------------------------------------
# 6. AUTOVACUUM & MAINTENANCE
# --------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_scale_factor = 0.1    # Trigger vacuum when 10% of rows are updated/deleted
autovacuum_analyze_scale_factor = 0.05  # Trigger analyze when 5% of rows change

# --------------------------------------------------------------------------
# 7. SHARED LIBRARIES & QUERY DIAGNOSTICS
# --------------------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
